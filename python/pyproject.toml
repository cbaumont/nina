[project]
name = "nina"
version = "0.1.0"
description = "AI pair-programming companion for people learning to code"
requires-python = ">=3.13,<3.14"
dependencies = [
    "claude-agent-sdk>=0.2.134",
    "textual>=0.60",
    "watchdog>=4.0",
    "pyperclip>=1.9",
]

[project.scripts]
nina = "nina.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nina"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/nina/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "pyperclip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
